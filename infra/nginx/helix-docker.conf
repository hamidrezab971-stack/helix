# REVIEWED CANDIDATE ONLY. Preserve the current file before installing.
# Install only after isolated verification and explicit production authorization.
server {
    listen 80;
    listen [::]:80;
    server_name helix.localip.ir;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/helix-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://helix.localip.ir$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name helix.localip.ir;
    ssl_certificate /etc/letsencrypt/live/helix.localip.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helix.localip.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HelixTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    # Retained hashed assets remain available to already-open browser tabs.
    root /opt/helix/current/smooth/frontend/dist;
    client_max_body_size 10m;
    # Avoid retaining query strings (potentially containing private data).
    access_log off;
    error_log /var/log/nginx/helix.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Phase 21.3: installed in the existing TLS server by deploy-monitoring-browser.py.
    # Grafana itself retains login, RBAC and plugin signature verification.
    # Redirects use error_page so Nginx access checks run before canonicalization.
    location = /grafana {
        include /etc/nginx/snippets/helix-monitoring-access.conf;
        error_page 404 =308 https://helix.localip.ir/grafana/;
        try_files /__helix_no_such_monitoring_file__ =404;
    }
    location ^~ /grafana/ {
        include /etc/nginx/snippets/helix-monitoring-access.conf;
        # Keep the prefix: Grafana handles it with serve_from_sub_path=true.
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /grafana;
        proxy_set_header Origin $http_origin;
        # Also handles Grafana Live at /grafana/api/live/ws.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $helix_monitoring_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        # Edge Basic auth must not become Grafana's backend Basic auth identity.
        # Grafana API tokens can be used over an authenticated session instead.
        proxy_set_header Authorization "";
        proxy_cookie_flags ~ secure httponly samesite=lax;
    }
    location = /prometheus {
        include /etc/nginx/snippets/helix-monitoring-admin-access.conf;
        error_page 404 =308 https://helix.localip.ir/prometheus/;
        try_files /__helix_no_such_monitoring_file__ =404;
    }
    location = /prometheus/metrics { return 404; }
    location = /prometheus/federate { return 404; }
    location ^~ /prometheus/api/v1/admin/ { return 404; }
    location ^~ /prometheus/api/v1/write { return 404; }
    location ^~ /prometheus/api/v1/read { return 404; }
    location ^~ /prometheus/api/v1/otlp/ { return 404; }
    location ^~ /prometheus/-/ { return 404; }
    location ^~ /prometheus/ {
        include /etc/nginx/snippets/helix-monitoring-admin-access.conf;
        limit_except GET HEAD { deny all; }
        # Strip the public prefix; private API and scrape paths stay unchanged.
        proxy_pass http://127.0.0.1:19090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /prometheus;
        proxy_set_header Authorization "";
    }
    location = /monitoring {
        include /etc/nginx/snippets/helix-monitoring-access.conf;
        error_page 404 =308 https://helix.localip.ir/monitoring/;
        try_files /__helix_no_such_monitoring_file__ =404;
    }
    location ^~ /monitoring/ {
        include /etc/nginx/snippets/helix-monitoring-access.conf;
        root /var/www/helix-monitoring;
        try_files /index.html =404;
    }
    # Nginx normalizes escapes and repeated slashes before choosing locations.
    # Deny malformed/case-varied near-matches instead of the application's SPA.
    location ~* ^/(grafana|prometheus|monitoring)(?:[^a-z0-9_-]|$) { return 404; }
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location = /metrics { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location = /api { return 404; }
    location ~ /\. { return 404; }
    location = /ws {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
    # Serve the exact frontend built into the candidate image. This prevents
    # an old host release symlink from selecting a mismatched frontend.
    location /assets/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_intercept_errors on;
        error_page 404 = @retained_asset;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
    location @retained_asset {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
    location / {
        # Preserve the current Nginx SPA fallback, only for page paths.
        proxy_pass http://127.0.0.1:18000;
        proxy_intercept_errors on;
        error_page 404 = /index.html;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
    location = /index.html {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
}
