# Prepared for review only. Installing this public site requires explicit approval.
server {
    listen 80;
    listen [::]:80;
    server_name helix.localip.ir;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/helix-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://helix.localip.ir$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name helix.localip.ir;
    ssl_certificate /etc/letsencrypt/live/helix.localip.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helix.localip.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HelixTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Retry-After 60 always;
    location / { return 503; }
}
