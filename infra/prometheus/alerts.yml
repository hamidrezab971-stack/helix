groups:
  - name: helix
    rules:
      - alert: HelixUnavailable
        expr: up{job="helix"} == 0 or absent(up{job="helix"})
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: HELIX metrics target unavailable
          description: Check API health, credentials and container state; scrape health alone is not an end-to-end probe.
      - alert: HelixSustainedHttpErrors
        expr: sum(rate(helix_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(helix_http_requests_total[5m])), 0.001) > 0.05 and sum(increase(helix_http_requests_total[5m])) >= 20
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: HELIX HTTP 5xx responses exceed 5 percent
      - alert: HostLowDiskSpace
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/"} < 0.15
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: Host root disk has less than 15 percent available
      - alert: HostCollectorStale
        expr: time() - helix_host_collector_timestamp_seconds > 120 or absent(helix_host_collector_timestamp_seconds)
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Host service and container collector is stale
      - alert: HelixApiHealthFailed
        expr: helix_api_health == 0 or absent(helix_api_health)
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: HELIX database health endpoint failed
