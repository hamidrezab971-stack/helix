# Optional, NOT used by active production. Use only after administrator access
# and the monitoring release gates pass. Recreate Prometheus alone, never app.
# route-prefix=/ preserves the existing private datasource/scrape URLs.
services:
  prometheus:
    networks:
      monitoring: {}
      ingress:
        gw_priority: 1
    ports: ['127.0.0.1:19090:9090']
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=0.0.0.0:9090
      - --web.external-url=https://helix.localip.ir/prometheus/
      - --web.route-prefix=/
